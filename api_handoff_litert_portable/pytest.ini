[pytest]
testpaths = tests
# Default run is unit-only and fast: no model, no assets, no weather files.
# Integration tests need the real daily master / LONG / representative CSV and
# are opted into explicitly:
#     pytest -q -m integration
addopts = -m "not integration"
markers =
    integration: needs real data + package assets (see tests/test_generic_batch.py)
