  stage1:
    model_class: "xgboost.Booster"   # TODO: verify from ckpt['model_type']
    loader_signature: "TODO: confirm exact load_model(bytes) path"
    feature_builder: "rice.scripts.run_event_train:build_tabular_from_samples"
