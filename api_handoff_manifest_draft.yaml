    pi_helper: "rice.scripts.phase_r_oracle_iou:iou_for_mu"
    overlap_helper: "rice.src.train_eval:overlap_metrics"
  selector:
    trainer: "rice.scripts.phase_b_stage2_offset_selector_v2_ranking:main"
    feature_builder: "rice.scripts.phase_b_stage2_offset_selector_v2_ranking:build_candidate_rows"
    apply_helper: "rice.scripts.phase_b_stage2_offset_selector_v2_ranking:pick_offsets"
  climatology:
    generator: "rice.scripts.phase_b_climatology_baseline:main"
    inference: "constant mu = climatology_mean_<L|mid|R> per pest"

