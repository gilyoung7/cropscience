    alert_builder: "rice.scripts.run_event_eval:build_alert_rows"
    tau_picker:  "rice.scripts.run_event_eval:best_tau_by_target"   # offline; deploy uses stored k/tau
    dispatch_table_builder: "rice.scripts.build_dispatch_feature_table:main"
  stage2:
    model_class: "rice.src.model:HierarchicalCausalHazardTransformer"
    loader_pattern: "see rice/scripts/run_train.py lines 1300-1340 for full attr setup"
