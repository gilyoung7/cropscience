# ---------- API contract recommendations (informational, not enforced) ----------
api_contract:
  request:
    pest: "one of [BPH, WBPH, bacterial_blight, blast, brown_spot, rice_stem_borer_1, rice_stem_borer_2, sheath_blight]"
    site_id: "string"
    year: "int"
    today_doy: "int (optional; defaults to current date)"
  response:
    stage1:
      alert_fired: "bool"
      alert_tstar_doy: "int or null"
      gate_method: "string"
    stage2:
      mu_doy: "float (predicted event center DOY)"
      pi_95:
        lower: "int (mu - 9.8 rounded)"
        upper: "int (mu + 9.8 rounded)"
      sigma: 5.0
      selected_offset: "int in {7,14,21,30,45,60} (selector output)"
      source: "one of {learned_v2_<variant>, climatology_mean_mid, ...}"
    fallback_triggered: "bool"
  no_alert_response:
    "TODO (Q11): define what API returns when Stage-1 gate doesn't fire"

